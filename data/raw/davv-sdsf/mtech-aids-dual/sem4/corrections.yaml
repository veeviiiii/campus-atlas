# Human corrections to what the model read, for the Semester 4 pack. Format: pipeline/corrections.py.
# Found by a second reader comparing every question with the photo of its page. Nothing here is
# applied until a person has looked at the page and changed `status: proposed` to `confirmed`
# (or deleted the entry). Check with:
#   .venv/Scripts/python -m pipeline.intake check data/raw/davv-sdsf/mtech-aids-dual/sem4/manifest.yaml

reader: "Claude Fable 5.2 (second reader), 2026-11-16"

audited_pages:

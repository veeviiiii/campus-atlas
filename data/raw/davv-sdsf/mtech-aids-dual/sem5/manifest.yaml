# Human ground truth for the Semester 5 papers. The pipeline reads every page header too, but this
# file wins and the run report lists every disagreement.
#
# Sources: "5th sem question paper.pdf" (2025-26, batch 2023-28) and a senior's "Sem-5 End Sem Papers.pdf"
# and "Sem-5 Test Papers.pdf" (2024-25, batch 2022-27). A student's handwritten name and roll number
# were blacked out on five 2024-25 End Sem pages before these PDFs were made; pages that held two
# papers were split in two.
#
# Waiting for the maintainer (not listed here): papers that print no test number. 2025-26: Statistical
# Inference (a 20-mark test), Python "MID Test", Computer Network "MID Test", and a Data Engineering
# case study with no header. 2024-25: Software Engineering "Test-I" dated 17/11/24 (after Test-2 on
# 21-10-2024), Computer Network "MID Test", and a Statistical Inference test with no name.

schema_version: "1.0"


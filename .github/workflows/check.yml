# On every push to main and every pull request: the pipeline's unit tests, then the site's lint, unit
# tests and static build. No API key, no model calls: the pipeline tests use a fake model.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only what the tested code imports; the full requirements pull in torch for the embedding model.
      - run: pip install pymupdf pillow "pydantic>=2" pyyaml python-dotenv numpy
      - run: python -m unittest discover -s pipeline/tests -t .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
